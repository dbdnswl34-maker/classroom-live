<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>교실 실시간 도구 - 선생님 화면</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
</head>
<body>
<div class="wrap">
  <div class="card row" style="justify-content: space-between;">
    <h1 style="font-size: 22px;">🏫 교실 실시간 도구 - 선생님 화면</h1>
    <span id="authStatus" class="status-badge warn">연결 중...</span>
  </div>

  <div class="card">
    <div class="row" style="justify-content: space-between;">
      <div>
        <div class="muted" style="margin-bottom:6px;">현재 수업 코드</div>
        <div id="sessionCode" class="session-code">-</div>
      </div>
      <div id="qrHolder"></div>
      <div class="row">
        <button id="newSessionBtn">🔄 새 수업 시작</button>
      </div>
    </div>
    <p id="studentLink" class="muted" style="word-break: break-all;"></p>
  </div>

  <div class="card">
    <div class="row" style="justify-content: space-between; margin-bottom: 8px;">
      <h3>🧑‍🎓 입장한 학생 (<span id="studentCount">0</span>명)</h3>
    </div>
    <div id="studentChips" class="chip-list">
      <span class="muted">아직 입장한 학생이 없어요.</span>
    </div>
  </div>

  <div class="tabs">
    <button id="tabPicker" class="active">🎲 랜덤 뽑기</button>
    <button id="tabCloud">☁️ 글자구름</button>
    <button id="tabReaction">🙋 반응</button>
    <button id="tabPoll">📊 투표</button>
    <button id="tabBuzzer">🔔 버저</button>
  </div>

  <div id="pickerPanel" class="card">
    <div class="row" style="margin-bottom: 16px;">
      <label class="row"><input type="checkbox" id="poolAllInput" checked /> 입장한 학생 중에서 뽑기</label>
      <label class="row">범위(1~N):
        <input type="number" id="poolRangeInput" min="1" max="200" value="30" style="width:80px" disabled />
      </label>
      <label class="row"><input type="checkbox" id="noRepeatInput" checked /> 중복 없이 뽑기</label>
    </div>
    <div class="mode-select row" style="margin-bottom: 16px;">
      <button class="mode-btn active" data-mode="spinner">🎡 스피너</button>
      <button class="mode-btn" data-mode="lottery">🎫 제비뽑기</button>
      <button class="mode-btn" data-mode="race">🏃 경주</button>
      <button class="mode-btn" data-mode="pinball">🎯 핀볼</button>
    </div>
    <div id="pickerStage" class="picker-stage"></div>
    <div class="row" style="justify-content:center;">
      <button id="pickBtn">뽑기!</button>
      <button id="resetHistoryBtn" class="secondary">뽑기 기록 초기화</button>
    </div>
    <div style="margin-top: 20px;">
      <div class="muted" style="margin-bottom:6px;">뽑힌 기록</div>
      <div id="pickHistory" class="chip-list"></div>
    </div>
  </div>

  <div id="cloudPanel" class="card" style="display:none;">
    <div class="row" style="justify-content: space-between; margin-bottom: 12px;">
      <p class="muted" style="margin:0;">학생 화면이 자동으로 단어 입력 화면으로 바뀝니다.</p>
      <button id="resetWordsBtn" class="secondary">글자구름 초기화</button>
    </div>
    <div id="wordcloud" class="wordcloud">
      <span class="muted">아직 제출된 단어가 없어요.</span>
    </div>
  </div>

  <div id="reactionPanel" class="card" style="display:none;">
    <div class="row" style="justify-content: space-between; margin-bottom: 12px;">
      <p class="muted" style="margin:0;">학생 화면에 반응 버튼이 뜹니다.</p>
      <button id="resetReactionsBtn" class="secondary">반응 초기화</button>
    </div>
    <div id="reactionBoard" class="reaction-board"></div>
  </div>

  <div id="pollPanel" class="card" style="display:none;">
    <div id="pollEditor">
      <p class="muted" style="margin-top:0;">질문과 선택지(2~4개)를 입력하고 투표를 시작하세요.</p>
      <input type="text" id="pollQuestionInput" placeholder="질문을 입력하세요" style="width:100%; margin-bottom:12px;" />
      <div class="poll-option-grid">
        <input type="text" class="poll-option-input" placeholder="선택지 1" />
        <input type="text" class="poll-option-input" placeholder="선택지 2" />
        <input type="text" class="poll-option-input" placeholder="선택지 3" />
        <input type="text" class="poll-option-input" placeholder="선택지 4" />
      </div>
      <button id="startPollBtn">투표 시작</button>
    </div>
    <div id="pollResults" style="display:none;">
      <h3 id="pollQuestionLabel"></h3>
      <div id="pollBars" class="poll-bars"></div>
      <div class="row" style="margin-top:16px;">
        <button id="newPollBtn" class="secondary">새 질문 만들기</button>
      </div>
    </div>
  </div>

  <div id="buzzerPanel" class="card" style="display:none;">
    <div class="row" style="justify-content: space-between; margin-bottom: 12px;">
      <p class="muted" style="margin:0;">학생 화면에 버튼이 뜨고, 누른 순서대로 여기 표시돼요.</p>
      <button id="newRoundBtn">🔔 새 라운드 시작</button>
    </div>
    <div id="buzzerOrder" class="buzzer-order">
      <span class="muted">아직 라운드가 시작되지 않았어요.</span>
    </div>
  </div>
</div>

<script type="module" src="teacher.js"></script>
</body>
</html>
